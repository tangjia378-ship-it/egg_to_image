<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#062c38">
  <title>AtollJelly · 环礁果冻</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f5fbf5;
      --muted: rgba(229, 247, 242, .64);
      --line: rgba(218, 248, 239, .17);
      --panel: rgba(5, 26, 32, .68);
      --accent: #64ead7;
      --gold: #ffd17a;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #061d25; }
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); }
    button, input { font: inherit; }
    #app, canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
    canvas { display: block; touch-action: none; cursor: grab; }
    canvas.dragging { cursor: grabbing; }
    .grain { position: fixed; inset: 0; pointer-events: none; opacity: .06; mix-blend-mode: soft-light; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E"); }
    .topbar { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; padding: max(22px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) 0 max(24px, env(safe-area-inset-left)); pointer-events: none; }
    .brand { text-shadow: 0 2px 18px rgba(0,0,0,.3); }
    .brand h1 { margin: 0; font-size: clamp(22px, 3vw, 38px); line-height: .92; letter-spacing: 0; font-weight: 680; }
    .brand h1 span { display: block; margin-top: 8px; color: var(--accent); font-size: 10px; line-height: 1; letter-spacing: .28em; font-weight: 720; }
    .brand-meta { display: flex; gap: 9px; align-items: center; margin-top: 13px; color: var(--muted); font: 600 10px/1.2 ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: .08em; }
    .pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 0 rgba(100,234,215,.5); animation: pulse 2.2s infinite; }
    @keyframes pulse { 70% { box-shadow: 0 0 0 8px rgba(100,234,215,0); } 100% { box-shadow: 0 0 0 0 rgba(100,234,215,0); } }
    .actions { display: flex; gap: 8px; pointer-events: auto; }
    .icon-btn { width: 42px; height: 42px; display: grid; place-items: center; padding: 0; border: 1px solid var(--line); border-radius: 7px; color: var(--ink); background: var(--panel); box-shadow: 0 12px 30px rgba(0, 16, 20, .18); backdrop-filter: blur(18px) saturate(1.3); cursor: pointer; transition: .18s ease; }
    .icon-btn:hover { border-color: rgba(218,248,239,.36); background: rgba(8,43,50,.75); transform: translateY(-1px); }
    .icon-btn.active { color: #062c38; background: var(--accent); border-color: var(--accent); }
    .icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .controls { position: fixed; right: max(24px, env(safe-area-inset-right)); bottom: max(24px, env(safe-area-inset-bottom)); width: min(326px, calc(100vw - 48px)); padding: 18px 18px 15px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); box-shadow: 0 22px 70px rgba(0, 12, 17, .32); backdrop-filter: blur(20px) saturate(1.35); }
    .panel-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
    .panel-head strong { font-size: 11px; letter-spacing: .18em; font-weight: 750; }
    .panel-head span { color: var(--accent); font: 650 10px/1 ui-monospace, SFMono-Regular, Consolas, monospace; }
    .control { padding: 11px 0; border-top: 1px solid var(--line); }
    .control:first-of-type { border-top: 0; }
    .control-label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; color: rgba(245,251,245,.86); font-size: 11px; font-weight: 620; }
    .control-label output { color: var(--muted); font: 600 10px/1 ui-monospace, SFMono-Regular, Consolas, monospace; }
    input[type="range"] { --v: 50%; appearance: none; width: 100%; height: 18px; margin: 0; background: transparent; cursor: pointer; }
    input[type="range"]::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: linear-gradient(90deg, var(--accent) var(--v), rgba(231,250,244,.15) var(--v)); }
    input[type="range"]::-webkit-slider-thumb { appearance: none; width: 13px; height: 13px; margin-top: -5px; border: 2px solid #e8fff9; border-radius: 50%; background: #0a3b43; box-shadow: 0 2px 8px rgba(0,0,0,.4); }
    input[type="range"]::-moz-range-track { height: 3px; background: rgba(231,250,244,.15); }
    input[type="range"]::-moz-range-progress { height: 3px; background: var(--accent); }
    input[type="range"]::-moz-range-thumb { width: 10px; height: 10px; border: 2px solid #e8fff9; border-radius: 50%; background: #0a3b43; }
    .day-marks { display: flex; justify-content: space-between; margin-top: 2px; color: rgba(229,247,242,.45); font-size: 8px; letter-spacing: .06em; }
    .hint { position: fixed; left: max(24px, env(safe-area-inset-left)); bottom: max(24px, env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 12px; color: rgba(235,250,245,.7); font-size: 10px; letter-spacing: .04em; pointer-events: none; text-shadow: 0 2px 12px rgba(0,0,0,.6); }
    .mouse { width: 18px; height: 25px; border: 1px solid rgba(240,255,250,.6); border-radius: 9px; position: relative; }
    .mouse::before { content: ""; position: absolute; left: 50%; top: 5px; width: 2px; height: 5px; border-radius: 1px; background: var(--accent); transform: translateX(-50%); }
    .loading { position: fixed; inset: 0; display: grid; place-items: center; background: #061d25; z-index: 20; transition: opacity .7s ease, visibility .7s; }
    .loading.hidden { opacity: 0; visibility: hidden; }
    .loader { width: min(360px, calc(100vw - 54px)); }
    .loader-title { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 13px; }
    .loader-title b { font-size: 16px; letter-spacing: .1em; }
    .loader-title span { color: var(--muted); font: 10px ui-monospace, monospace; }
    .loader-line { height: 2px; background: rgba(255,255,255,.12); overflow: hidden; }
    .loader-line::after { content: ""; display: block; width: 45%; height: 100%; background: var(--accent); animation: load 1.2s cubic-bezier(.7,0,.3,1) infinite; }
    @keyframes load { from { transform: translateX(-110%); } to { transform: translateX(245%); } }
    .unsupported { position: fixed; inset: 0; z-index: 30; display: none; place-items: center; padding: 24px; background: radial-gradient(circle at 50% 35%, #0c5060, #051a21 70%); }
    .unsupported.show { display: grid; }
    .unsupported-card { max-width: 520px; padding: 28px; border: 1px solid var(--line); border-radius: 8px; background: rgba(4,24,31,.72); }
    .unsupported h2 { margin: 0 0 12px; font-size: 26px; }
    .unsupported p { margin: 8px 0; color: var(--muted); line-height: 1.65; font-size: 14px; }
    .unsupported code { color: var(--accent); }
    @media (max-width: 720px) {
      .topbar { padding: max(17px, env(safe-area-inset-top)) 17px 0; }
      .brand h1 { font-size: 25px; }
      .brand h1 span { margin-top: 6px; font-size: 8px; }
      .brand-meta { margin-top: 9px; font-size: 8px; }
      .icon-btn { width: 38px; height: 38px; }
      .controls { left: 12px; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); width: auto; padding: 12px 14px 9px; }
      .panel-head { margin-bottom: 5px; }
      .control { display: grid; grid-template-columns: 88px 1fr; gap: 10px; align-items: center; padding: 8px 0; }
      .control-label { margin: 0; display: block; }
      .control-label output { display: block; margin-top: 4px; }
      .day-marks { display: none; }
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <main id="app">
    <canvas id="scene" aria-label="AtollJelly 交互式马尔代夫微缩环礁"></canvas>
    <div class="grain"></div>
    <header class="topbar">
      <div class="brand">
        <h1>ATOLLJELLY<span>MALDIVES / 03°12′N</span></h1>
        <div class="brand-meta"><i class="pulse"></i><span id="status">WEBGPU · INITIALIZING</span></div>
      </div>
      <div class="actions">
        <button class="icon-btn" id="sound" aria-label="开启环境音" title="环境音">
          <svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15 9.5a4 4 0 0 1 0 5"/><path d="M18 7a7 7 0 0 1 0 10"/></svg>
        </button>
        <button class="icon-btn" id="reset" aria-label="重置视角" title="重置视角">
          <svg viewBox="0 0 24 24"><path d="M4 4v6h6"/><path d="M5.5 15a8 8 0 1 0 .5-7l-2 2"/></svg>
        </button>
      </div>
    </header>

    <section class="controls" aria-label="环境控制">
      <div class="panel-head"><strong>环境调谐</strong><span id="fps">60 FPS</span></div>
      <div class="control">
        <label class="control-label" for="day"><span>昼夜光照</span><output id="dayOut">正午 · 12:00</output></label>
        <div><input id="day" type="range" min="0" max="1" value="0.38" step="0.001"><div class="day-marks"><span>日出</span><span>正午</span><span>黄昏</span><span>生物光</span></div></div>
      </div>
      <div class="control">
        <label class="control-label" for="tide"><span>潮汐高度</span><output id="tideOut">+0.12 m</output></label>
        <input id="tide" type="range" min="-0.25" max="0.5" value="0.12" step="0.01">
      </div>
      <div class="control">
        <label class="control-label" for="wave"><span>波浪动力</span><output id="waveOut">柔和</output></label>
        <input id="wave" type="range" min="0.15" max="1.65" value="0.72" step="0.01">
      </div>
    </section>

    <div class="hint"><i class="mouse"></i><span>拖动环游 · 滚轮缩放 · 点击水面投石</span></div>
    <div class="loading" id="loading"><div class="loader"><div class="loader-title"><b>ATOLLJELLY</b><span>正在凝聚海水</span></div><div class="loader-line"></div></div></div>
    <div class="unsupported" id="unsupported"><div class="unsupported-card"><h2>这片环礁需要 WebGPU</h2><p>请使用较新版本的 Chrome 或 Edge，并确认浏览器已启用硬件加速。</p><p>当前环境没有暴露 <code>navigator.gpu</code>，因此无法运行原生 WGSL 水体模拟。</p></div></div>
  </main>

  <script>
  (() => {
    'use strict';

    const canvas = document.querySelector('#scene');
    const loading = document.querySelector('#loading');
    const unsupported = document.querySelector('#unsupported');
    const statusEl = document.querySelector('#status');
    const fpsEl = document.querySelector('#fps');
    const dayEl = document.querySelector('#day');
    const tideEl = document.querySelector('#tide');
    const waveEl = document.querySelector('#wave');
    const dayOut = document.querySelector('#dayOut');
    const tideOut = document.querySelector('#tideOut');
    const waveOut = document.querySelector('#waveOut');
    const soundBtn = document.querySelector('#sound');
    const resetBtn = document.querySelector('#reset');

    const computeWGSL = /* wgsl */`
      struct Sim {
        values: vec4f,
        drop: vec4f,
      }
      @group(0) @binding(0) var source: texture_2d<f32>;
      @group(0) @binding(1) var destTex: texture_storage_2d<rgba16float, write>;
      @group(0) @binding(2) var caustics: texture_storage_2d<rgba8unorm, write>;
      @group(0) @binding(3) var<uniform> sim: Sim;

      fn hash(p: vec2f) -> f32 {
        return fract(sin(dot(p, vec2f(127.1, 311.7))) * 43758.5453);
      }

      @compute @workgroup_size(8, 8)
      fn main(@builtin(global_invocation_id) gid: vec3u) {
        let size = textureDimensions(source);
        if (gid.x >= size.x || gid.y >= size.y) { return; }
        let p = vec2i(gid.xy);
        let maxP = vec2i(size) - vec2i(1);
        let c = textureLoad(source, p, 0).rg;
        let l = textureLoad(source, clamp(p + vec2i(-1, 0), vec2i(0), maxP), 0).r;
        let r = textureLoad(source, clamp(p + vec2i( 1, 0), vec2i(0), maxP), 0).r;
        let d = textureLoad(source, clamp(p + vec2i(0, -1), vec2i(0), maxP), 0).r;
        let u = textureLoad(source, clamp(p + vec2i(0,  1), vec2i(0), maxP), 0).r;
        let lap = l + r + d + u - 4.0 * c.r;
        let dt = min(sim.values.y, 0.025);
        var velocity = (c.g + lap * (48.0 + 18.0 * sim.values.z) * dt) * 0.985;
        var height = c.r + velocity * dt;
        let uv = (vec2f(gid.xy) + 0.5) / vec2f(size);
        if (sim.drop.z > 0.5) {
          let delta = uv - sim.drop.xy;
          let kick = exp(-dot(delta, delta) * 1700.0) * sim.drop.w;
          velocity = velocity - kick * 9.0;
          height = height - kick * 0.16;
        }
        height = height * 0.9992;
        textureStore(destTex, p, vec4f(height, velocity, 0.0, 1.0));

        let gx = r - l;
        let gy = u - d;
        let rippleFocus = pow(clamp(0.56 + abs(lap) * 34.0 - length(vec2f(gx, gy)) * 4.0, 0.0, 1.0), 2.0);
        let cell = uv * 18.0;
        let proc = sin(cell.x * 2.3 + sim.values.x * 1.1 + sin(cell.y * 1.8)) *
                   sin(cell.y * 2.0 - sim.values.x * 0.85 + sin(cell.x * 1.4));
        let filaments = pow(clamp(0.45 + proc * 0.52, 0.0, 1.0), 5.0);
        let energy = clamp(rippleFocus * 0.76 + filaments * 0.38, 0.0, 1.0);
        textureStore(caustics, p, vec4f(energy, energy * 0.93, energy * 0.68, 1.0));
      }
    `;

    const renderWGSL = /* wgsl */`
      struct Uniforms {
        resolution_time_day: vec4f,
        camera: vec4f,
        focus: vec4f,
        sun: vec4f,
        params: vec4f,
        skyTop: vec4f,
        skyBottom: vec4f,
        misc: vec4f,
      }
      @group(0) @binding(0) var<uniform> uni: Uniforms;
      @group(0) @binding(1) var linearSampler: sampler;
      @group(0) @binding(2) var rippleTex: texture_2d<f32>;
      @group(0) @binding(3) var causticTex: texture_2d<f32>;

      const PI: f32 = 3.14159265359;

      struct VOut { @builtin(position) pos: vec4f, @location(0) uv: vec2f }
      @vertex fn vs(@builtin(vertex_index) id: u32) -> VOut {
        var p = array<vec2f, 3>(vec2f(-1.0,-1.0), vec2f(3.0,-1.0), vec2f(-1.0,3.0));
        var o: VOut;
        o.pos = vec4f(p[id], 0.0, 1.0);
        o.uv = p[id] * 0.5 + 0.5;
        return o;
      }

      fn sat(x: f32) -> f32 { return clamp(x, 0.0, 1.0); }
      fn hash21(p: vec2f) -> f32 { return fract(sin(dot(p, vec2f(127.1,311.7))) * 43758.5453); }
      fn hash31(p: vec3f) -> f32 { return fract(sin(dot(p, vec3f(127.1,311.7,74.7))) * 43758.5453); }
      fn rot(a: f32) -> mat2x2f { let c=cos(a); let s=sin(a); return mat2x2f(c,-s,s,c); }

      fn sdBox(p: vec3f, b: vec3f) -> f32 {
        let q = abs(p) - b;
        return length(max(q, vec3f(0.0))) + min(max(q.x, max(q.y, q.z)), 0.0);
      }
      fn sdSphere(p: vec3f, r: f32) -> f32 { return length(p) - r; }
      fn sdEllipsoid(p: vec3f, r: vec3f) -> f32 {
        let k0 = length(p / r);
        let k1 = length(p / (r * r));
        return k0 * (k0 - 1.0) / max(k1, 0.001);
      }
      fn sdCapsule(p: vec3f, a: vec3f, b: vec3f, r: f32) -> f32 {
        let pa=p-a; let ba=b-a;
        let h=sat(dot(pa,ba)/dot(ba,ba));
        return length(pa-ba*h)-r;
      }
      fn opU(a: vec2f, b: vec2f) -> vec2f { return select(b, a, a.x < b.x); }

      fn hutSDF(p0: vec3f, c: vec3f, ang: f32, scale: f32) -> vec2f {
        var p = p0 - c;
        p.xz = rot(ang) * p.xz;
        p /= scale;
        var r = vec2f(1e4, 4.0);
        r = opU(r, vec2f(sdBox(p-vec3f(0.0,.03,0.0), vec3f(1.18,.09,.82)), 4.0));
        r = opU(r, vec2f(sdBox(p-vec3f(0.0,.62,0.0), vec3f(.84,.55,.62)), 5.0));
        let rq = p-vec3f(0.0,1.35,0.0);
        let roof = max(abs(rq.z)-.84, abs(rq.x)/1.18 + abs(rq.y)/.67 - 1.0);
        r = opU(r, vec2f(roof, 6.0));
        r = opU(r, vec2f(sdCapsule(p,vec3f(-.88,-.58,-.55),vec3f(-.88,.04,-.55),.055),4.0));
        r = opU(r, vec2f(sdCapsule(p,vec3f(.88,-.58,-.55),vec3f(.88,.04,-.55),.055),4.0));
        r = opU(r, vec2f(sdCapsule(p,vec3f(-.88,-.58,.55),vec3f(-.88,.04,.55),.055),4.0));
        r = opU(r, vec2f(sdCapsule(p,vec3f(.88,-.58,.55),vec3f(.88,.04,.55),.055),4.0));
        return vec2f(r.x * scale, r.y);
      }

      fn palmSDF(p: vec3f, c: vec3f, s: f32) -> vec2f {
        var r = vec2f(sdCapsule(p, c, c+vec3f(.12,2.2,0.06)*s, .10*s), 7.0);
        let top = c+vec3f(.12,2.2,0.06)*s;
        for (var i=0; i<7; i++) {
          let a = f32(i)/7.0*PI*2.0;
          let end = top + vec3f(cos(a)*1.05, -.25+sin(f32(i)*2.4)*.1, sin(a)*1.05)*s;
          r = opU(r, vec2f(sdCapsule(p, top, end, .075*s), 8.0));
        }
        r = opU(r, vec2f(sdSphere(p-(top+vec3f(.1,-.08,.05)*s),.16*s),9.0));
        return r;
      }

      fn turtleSDF(p0: vec3f, phase: f32, radius: f32) -> vec2f {
        let t = uni.resolution_time_day.z*.24 + phase;
        let center = vec3f(cos(t)*radius, -.38 + sin(t*1.7)*.08, sin(t)*radius*.74);
        var p = p0-center;
        p.xz = rot(-t-PI*.5)*p.xz;
        var d = sdEllipsoid(p,vec3f(.46,.13,.32));
        d = min(d, sdSphere(p-vec3f(.52,.01,0.0),.13));
        let flap = sin(uni.resolution_time_day.z*2.5+phase)*.14;
        d = min(d, sdEllipsoid(p-vec3f(.05,0.0,.37),vec3f(.28,.045,.13+flap*.12)));
        d = min(d, sdEllipsoid(p-vec3f(.05,0.0,-.37),vec3f(.28,.045,.13-flap*.12)));
        d = min(d, sdEllipsoid(p-vec3f(-.37,0.0,.25),vec3f(.2,.04,.1)));
        d = min(d, sdEllipsoid(p-vec3f(-.37,0.0,-.25),vec3f(.2,.04,.1)));
        return vec2f(d, 10.0);
      }

      fn mapScene(p: vec3f) -> vec2f {
        var res = vec2f(1e4, 0.0);
        let base = sdEllipsoid(p-vec3f(0.0,-1.28,0.0),vec3f(7.55,1.55,5.85));
        res = opU(res, vec2f(base, 1.0));
        let islandA = sdEllipsoid(p-vec3f(-1.55,-.08,.22),vec3f(3.7,.48,2.5));
        let islandB = sdEllipsoid(p-vec3f(2.9,-.2,-1.2),vec3f(1.9,.32,1.1));
        res = opU(res, vec2f(min(islandA,islandB), 2.0));

        res = opU(res, vec2f(sdBox(p-vec3f(1.65,.25,.15),vec3f(2.45,.075,.18)),4.0));
        res = opU(res, vec2f(sdBox(p-vec3f(3.7,.25,-.65),vec3f(.17,.075,.95)),4.0));
        for (var i=0; i<6; i++) {
          let x = -.5 + f32(i)*.88;
          res = opU(res, vec2f(sdCapsule(p,vec3f(x,-.72,.0),vec3f(x,.2,.0),.035),4.0));
        }

        res = opU(res, hutSDF(p,vec3f(3.65,.31,-1.65),.12,.72));
        res = opU(res, hutSDF(p,vec3f(3.7,.31,.42),-.08,.7));
        res = opU(res, hutSDF(p,vec3f(2.05,.26,1.45),-.34,.62));
        res = opU(res, hutSDF(p,vec3f(.55,.22,1.75),-.58,.58));

        res = opU(res, palmSDF(p,vec3f(-2.35,.28,.18),.87));
        res = opU(res, palmSDF(p,vec3f(-1.15,.34,-.72),.72));
        res = opU(res, palmSDF(p,vec3f(-2.82,.18,1.1),.62));

        res = opU(res, turtleSDF(p,.4,4.15));
        res = opU(res, turtleSDF(p,3.7,3.1));
        return res;
      }

      fn calcNormal(p: vec3f) -> vec3f {
        let e=.0025;
        let h=vec2f(e,0.0);
        return normalize(vec3f(
          mapScene(p+h.xyy).x-mapScene(p-h.xyy).x,
          mapScene(p+h.yxy).x-mapScene(p-h.yxy).x,
          mapScene(p+h.yyx).x-mapScene(p-h.yyx).x));
      }

      fn trace(ro: vec3f, rd: vec3f, maxD: f32) -> vec2f {
        var t=0.01; var id=0.0;
        for(var i=0; i<96; i++) {
          let h=mapScene(ro+rd*t);
          id=h.y;
          if(h.x<.0025 || t>maxD){break;}
          t += h.x*.72;
        }
        return vec2f(t,id);
      }

      fn softShadow(ro: vec3f, rd: vec3f) -> f32 {
        var t=.03; var shade=1.0;
        for(var i=0;i<14;i++){
          let h=mapScene(ro+rd*t).x;
          shade=min(shade,12.0*h/t);
          t+=clamp(h,.025,.35);
          if(h<.002||t>9.0){break;}
        }
        return sat(shade);
      }

      fn rippleUV(xz: vec2f) -> vec2f { return xz / vec2f(16.0,12.4) + .5; }
      fn waterHeight(xz: vec2f) -> f32 {
        let uv=rippleUV(xz);
        let ripple=textureSampleLevel(rippleTex,linearSampler,uv,0.0).r;
        let t=uni.resolution_time_day.z;
        let w=uni.params.y;
        let swell=(sin(xz.x*1.15+t*.82)+sin(xz.y*1.48-t*.68)+sin((xz.x+xz.y)*.73+t*.5))*.018*w;
        return .17+uni.params.x+swell+ripple*.8;
      }
      fn waterNormal(xz: vec2f) -> vec3f {
        let e=.035;
        let hx=waterHeight(xz+vec2f(e,0.0))-waterHeight(xz-vec2f(e,0.0));
        let hz=waterHeight(xz+vec2f(0.0,e))-waterHeight(xz-vec2f(0.0,e));
        return normalize(vec3f(-hx/(2.0*e),1.0,-hz/(2.0*e)));
      }
      fn insideLagoon(xz: vec2f) -> f32 {
        return 1.0-smoothstep(.88,1.0,length(xz/vec2f(7.7,5.95)));
      }
      fn waterHit(ro:vec3f,rd:vec3f)->f32{
        var t=(waterHeight(vec2f(0.0))-ro.y)/rd.y;
        for(var i=0;i<5;i++){
          let p=ro+rd*t;
          t+=(waterHeight(p.xz)-p.y)/rd.y;
        }
        let p=ro+rd*t;
        if(t<0.0||insideLagoon(p.xz)<.1){return 1e4;}
        return t;
      }

      fn palette(id:f32,p:vec3f,n:vec3f)->vec3f{
        if(id<1.5){
          let depth=sat((-p.y+.08)*.42);
          let coralMask=pow(sat(sin(p.x*12.0+sin(p.z*7.0))*sin(p.z*10.0-p.x*2.0)),10.0);
          let coral=coralMask*vec3f(.3,.1,.07);
          return mix(vec3f(.78,.70,.48),vec3f(.18,.39,.34),depth)+coral;
        }
        if(id<2.5){return mix(vec3f(.91,.79,.55),vec3f(.71,.58,.37),sat((-.02-p.y)*2.0));}
        if(id<4.5){return vec3f(.29,.16,.075)*(1.0+hash31(floor(p*18.0))*.18);}
        if(id<5.5){return vec3f(.66,.38,.18);}
        if(id<6.5){return mix(vec3f(.63,.43,.19),vec3f(.88,.68,.31),hash31(floor(p*20.0)));}
        if(id<7.5){return vec3f(.31,.17,.07);}
        if(id<8.5){return mix(vec3f(.08,.27,.12),vec3f(.23,.53,.17),hash31(floor(p*12.0)));}
        if(id<9.5){return vec3f(.42,.27,.11);}
        return mix(vec3f(.10,.28,.22),vec3f(.36,.55,.31),sat(n.y*.7+.3));
      }

      fn sky(rd:vec3f)->vec3f{
        let h=sat(rd.y*.55+.45);
        var col=mix(uni.skyBottom.rgb,uni.skyTop.rgb,pow(h,.72));
        let sunDot=max(dot(rd,normalize(uni.sun.xyz)),0.0);
        col+=vec3f(1.0,.72,.36)*pow(sunDot,420.0)*(1.0-uni.params.z);
        col+=vec3f(1.0,.36,.16)*pow(sunDot,16.0)*.16;
        let stars=step(.99925,hash31(floor(rd*1450.0)))*uni.params.z;
        col+=stars*vec3f(.6,.9,1.0);
        return col;
      }

      fn shade(p:vec3f,n:vec3f,id:f32,underwater:f32)->vec3f{
        let sunDir=normalize(uni.sun.xyz);
        let diff=max(dot(n,sunDir),0.0);
        let sh=softShadow(p+n*.012,sunDir);
        var col=palette(id,p,n);
        let hemi=.34+.36*sat(n.y*.5+.5);
        col*=hemi+diff*sh*(1.0-uni.params.z*.65)*1.18;
        if(underwater>.5){
          let uv=rippleUV(p.xz);
          let cau=textureSampleLevel(causticTex,linearSampler,uv,0.0).r;
          col+=vec3f(.12,.72,.58)*cau*sat(n.y*.7+.3)*(1.0-uni.params.z*.7);
          let bioWave=sin(p.x*19.0+uni.resolution_time_day.z*.8+sin(p.z*3.0))*
                      sin(p.z*17.0-uni.resolution_time_day.z*.6+sin(p.x*4.0));
          let bio=pow(sat(bioWave),22.0)*uni.params.z;
          col+=bio*vec3f(.08,1.0,.86)*1.5;
        }
        return col;
      }

      @fragment fn fs(in:VOut)->@location(0) vec4f{
        let res=uni.resolution_time_day.xy;
        let frag=in.uv*res;
        let xy=(frag*2.0-res)/res.y;
        let ro=uni.camera.xyz;
        let ta=uni.focus.xyz;
        let ww=normalize(ta-ro);
        let uu=normalize(cross(ww,vec3f(0.0,1.0,0.0)));
        let vv=cross(uu,ww);
        let rd=normalize(uu*xy.x+vv*xy.y+ww*1.72);
        var col=sky(rd);

        let primary=trace(ro,rd,28.0);
        let tw=waterHit(ro,rd);
        if(primary.x<tw && primary.x<28.0){
          let p=ro+rd*primary.x;
          let n=calcNormal(p);
          col=shade(p,n,primary.y,0.0);
          let fog=1.0-exp(-primary.x*.025);
          col=mix(col,sky(rd),fog);
        } else if(tw<28.0){
          let wp=ro+rd*tw;
          let wn=waterNormal(wp.xz);
          let refr=refract(rd,wn,.74);
          let hit=trace(wp+refr*.025,refr,22.0);
          let shallow=1.0-sat(length(wp.xz/vec2f(7.1,5.35)));
          var deepCol=mix(vec3f(.008,.15,.22),vec3f(.02,.58,.54),pow(shallow,.82));
          if(hit.x<22.0){
            let p=wp+refr*(hit.x+.025);
            let n=calcNormal(p);
            let bottom=shade(p,n,hit.y,1.0);
            let absorb=.34+(1.0-exp(-hit.x*mix(.2,.52,1.0-shallow)))*.66;
            deepCol=mix(bottom,deepCol,absorb);
          }
          let refl=sky(reflect(rd,wn));
          let fres=pow(1.0-sat(dot(-rd,wn)),5.0)*.78+.07;
          let sparkle=pow(max(dot(reflect(-normalize(uni.sun.xyz),wn),-rd),0.0),180.0)*(1.0-uni.params.z);
          col=mix(deepCol,refl,fres)+sparkle*vec3f(1.0,.86,.56)*1.7;
          let edge=insideLagoon(wp.xz);
          col=mix(sky(rd),col,edge);
          col+=uni.params.z*vec3f(.0,.16,.2)*pow(1.0-sat(dot(-rd,wn)),2.0);
        }

        let vignette=1.0-.22*dot(in.uv-.5,in.uv-.5);
        col*=vignette;
        col=col/(col+vec3f(1.0));
        col=pow(col,vec3f(.4545));
        let dither=(hash21(frag)-.5)/255.0;
        return vec4f(col+dither,1.0);
      }
    `;

    const state = {
      yaw: -0.62,
      pitch: 0.48,
      distance: 12.8,
      target: [0, 0.15, 0],
      day: +dayEl.value,
      tide: +tideEl.value,
      wave: +waveEl.value,
      drop: null,
      pointer: null,
      moved: false,
      audio: null
    };

    function setRangeFill(el) {
      const v = (+el.value - +el.min) / (+el.max - +el.min) * 100;
      el.style.setProperty('--v', `${v}%`);
    }
    [dayEl,tideEl,waveEl].forEach(setRangeFill);

    function daylightLabel(v) {
      if (v < .2) return ['日出', 6 + v / .2 * 3];
      if (v < .52) return ['正午', 9 + (v-.2)/.32*6];
      if (v < .76) return ['黄昏', 15 + (v-.52)/.24*4];
      return ['生物荧光', 19 + (v-.76)/.24*5];
    }
    function updateLabels() {
      const [name,hour] = daylightLabel(state.day);
      const hh = Math.floor(hour) % 24;
      const mm = Math.floor((hour-hh)*60);
      dayOut.value = `${name} · ${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
      tideOut.value = `${state.tide >= 0 ? '+' : ''}${state.tide.toFixed(2)} m`;
      waveOut.value = state.wave < .55 ? '静谧' : state.wave < 1.05 ? '柔和' : state.wave < 1.4 ? '活跃' : '涌动';
    }
    updateLabels();

    dayEl.addEventListener('input', () => { state.day=+dayEl.value; setRangeFill(dayEl); updateLabels(); });
    tideEl.addEventListener('input', () => { state.tide=+tideEl.value; setRangeFill(tideEl); updateLabels(); });
    waveEl.addEventListener('input', () => { state.wave=+waveEl.value; setRangeFill(waveEl); updateLabels(); });

    function cameraPosition() {
      const cp=Math.cos(state.pitch), sp=Math.sin(state.pitch), cy=Math.cos(state.yaw), sy=Math.sin(state.yaw);
      return [state.target[0]+state.distance*cp*sy, state.target[1]+state.distance*sp, state.target[2]+state.distance*cp*cy];
    }

    function waterPointFromScreen(uv) {
      const ro=cameraPosition();
      const sub=(a,b)=>a.map((v,i)=>v-b[i]);
      const mul=(a,s)=>a.map(v=>v*s);
      const add=(a,b)=>a.map((v,i)=>v+b[i]);
      const norm=a=>{const l=Math.hypot(...a)||1;return a.map(v=>v/l);};
      const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
      const forward=norm(sub(state.target,ro));
      const right=norm(cross(forward,[0,1,0]));
      const up=cross(right,forward);
      const aspect=canvas.clientWidth/canvas.clientHeight;
      const x=(uv[0]*2-1)*aspect;
      const y=(1-uv[1]*2);
      const rd=norm(add(add(mul(right,x),mul(up,y)),mul(forward,1.72)));
      const waterY=.17+state.tide;
      if(rd[1]>=-.001) return null;
      const t=(waterY-ro[1])/rd[1];
      if(t<=0) return null;
      const p=add(ro,mul(rd,t));
      const ellipse=Math.hypot(p[0]/7.7,p[2]/5.95);
      if(ellipse>1) return null;
      return [p[0]/16+.5,p[2]/12.4+.5];
    }

    resetBtn.addEventListener('click', () => {
      state.yaw=-.62; state.pitch=.48; state.distance=12.8;
    });

    function pointerXY(e) {
      const r=canvas.getBoundingClientRect();
      return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height];
    }
    canvas.addEventListener('pointerdown', e => {
      canvas.setPointerCapture(e.pointerId);
      state.pointer={id:e.pointerId,x:e.clientX,y:e.clientY,px:e.clientX,py:e.clientY};
      state.moved=false;
      canvas.classList.add('dragging');
    });
    canvas.addEventListener('pointermove', e => {
      if(!state.pointer || e.pointerId!==state.pointer.id) return;
      const dx=e.clientX-state.pointer.px, dy=e.clientY-state.pointer.py;
      if(Math.hypot(e.clientX-state.pointer.x,e.clientY-state.pointer.y)>5) state.moved=true;
      if(state.moved){
        state.yaw-=dx*.006;
        state.pitch=Math.max(.12,Math.min(1.25,state.pitch+dy*.005));
      }
      state.pointer.px=e.clientX; state.pointer.py=e.clientY;
    });
    canvas.addEventListener('pointerup', e => {
      if(state.pointer && !state.moved) state.drop=waterPointFromScreen(pointerXY(e));
      state.pointer=null; canvas.classList.remove('dragging');
    });
    canvas.addEventListener('pointercancel', () => { state.pointer=null; canvas.classList.remove('dragging'); });
    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      state.distance=Math.max(7.2,Math.min(20,state.distance*Math.exp(e.deltaY*.001)));
    }, {passive:false});

    function makeAudio() {
      const AudioCtx=window.AudioContext||window.webkitAudioContext;
      if(!AudioCtx) return null;
      const ctx=new AudioCtx();
      const master=ctx.createGain(); master.gain.value=.0; master.connect(ctx.destination);
      const seconds=4, buffer=ctx.createBuffer(2,ctx.sampleRate*seconds,ctx.sampleRate);
      for(let c=0;c<2;c++){
        const data=buffer.getChannelData(c); let brown=0;
        for(let i=0;i<data.length;i++){
          brown=(brown+(Math.random()*2-1)*.025)/1.025;
          data[i]=brown*3.4+(Math.random()*2-1)*.055;
        }
      }
      const surf=ctx.createBufferSource(); surf.buffer=buffer; surf.loop=true;
      const low=ctx.createBiquadFilter(); low.type='lowpass'; low.frequency.value=520; low.Q.value=.7;
      const surfGain=ctx.createGain(); surfGain.gain.value=.24;
      const wind=ctx.createBufferSource(); wind.buffer=buffer; wind.loop=true;
      const high=ctx.createBiquadFilter(); high.type='bandpass'; high.frequency.value=1250; high.Q.value=.5;
      const windGain=ctx.createGain(); windGain.gain.value=.075;
      const lfo=ctx.createOscillator(); lfo.frequency.value=.075;
      const lfoGain=ctx.createGain(); lfoGain.gain.value=.12;
      const panner=ctx.createStereoPanner();
      lfo.connect(lfoGain); lfoGain.connect(surfGain.gain);
      surf.connect(low).connect(surfGain).connect(panner);
      wind.connect(high).connect(windGain).connect(panner);
      panner.connect(master);
      surf.start(); wind.start(); lfo.start();
      return {ctx,master,panner,enabled:false};
    }
    soundBtn.addEventListener('click', async () => {
      if(!state.audio) state.audio=makeAudio();
      if(!state.audio) return;
      await state.audio.ctx.resume();
      state.audio.enabled=!state.audio.enabled;
      state.audio.master.gain.cancelScheduledValues(state.audio.ctx.currentTime);
      state.audio.master.gain.linearRampToValueAtTime(state.audio.enabled ? .58 : 0,state.audio.ctx.currentTime+.6);
      soundBtn.classList.toggle('active',state.audio.enabled);
      soundBtn.setAttribute('aria-label',state.audio.enabled?'关闭环境音':'开启环境音');
    });

    function mix(a,b,t){return a.map((v,i)=>v+(b[i]-v)*t);}
    function lightState(v){
      let top,bottom,sun,night;
      if(v<.2){const t=v/.2;top=mix([.18,.34,.48],[.12,.52,.7],t);bottom=mix([.95,.44,.25],[.66,.86,.83],t);sun=mix([-.7,.2,.4],[-.38,.88,.28],t);night=0;}
      else if(v<.52){const t=(v-.2)/.32;top=mix([.12,.52,.7],[.08,.42,.68],t);bottom=mix([.66,.86,.83],[.64,.87,.88],t);sun=mix([-.38,.88,.28],[.22,.96,.18],t);night=0;}
      else if(v<.76){const t=(v-.52)/.24;top=mix([.08,.42,.68],[.18,.16,.31],t);bottom=mix([.64,.87,.88],[.93,.34,.19],t);sun=mix([.22,.96,.18],[.76,.14,.36],t);night=t*.25;}
      else {const t=(v-.76)/.24;top=mix([.18,.16,.31],[.008,.035,.09],t);bottom=mix([.93,.34,.19],[.01,.14,.2],t);sun=mix([.76,.14,.36],[-.45,-.15,.3],t);night=.25+t*.75;}
      return {top,bottom,sun,night};
    }

    async function start() {
      if(!navigator.gpu){ loading.classList.add('hidden'); unsupported.classList.add('show'); return; }
      const adapter=await navigator.gpu.requestAdapter({powerPreference:'high-performance'});
      if(!adapter){ loading.classList.add('hidden'); unsupported.classList.add('show'); return; }
      const device=await adapter.requestDevice();
      device.lost.then(info=>{ statusEl.textContent='GPU LOST · '+info.message.toUpperCase(); });
      device.addEventListener('uncapturederror', event => {
        console.error(event.error);
        statusEl.textContent='WEBGPU · RENDER ERROR';
        unsupported.classList.add('show');
        unsupported.querySelector('p:last-child').innerHTML=`渲染失败：<code>${String(event.error.message||event.error)}</code>`;
      });
      const context=canvas.getContext('webgpu');
      const format=navigator.gpu.getPreferredCanvasFormat();
      context.configure({device,format,alphaMode:'opaque'});

      const simSize=256;
      const rippleTextures=[0,1].map(()=>device.createTexture({
        size:[simSize,simSize],format:'rgba16float',
        usage:GPUTextureUsage.TEXTURE_BINDING|GPUTextureUsage.STORAGE_BINDING|GPUTextureUsage.COPY_DST
      }));
      const causticTexture=device.createTexture({size:[simSize,simSize],format:'rgba8unorm',usage:GPUTextureUsage.TEXTURE_BINDING|GPUTextureUsage.STORAGE_BINDING});
      const uniformBuffer=device.createBuffer({size:128,usage:GPUBufferUsage.UNIFORM|GPUBufferUsage.COPY_DST});
      const simBuffer=device.createBuffer({size:32,usage:GPUBufferUsage.UNIFORM|GPUBufferUsage.COPY_DST});
      const sampler=device.createSampler({magFilter:'linear',minFilter:'linear',addressModeU:'clamp-to-edge',addressModeV:'clamp-to-edge'});

      const computeModule=device.createShaderModule({label:'Atoll water compute',code:computeWGSL});
      const renderModule=device.createShaderModule({label:'Atoll raymarch render',code:renderWGSL});
      const computePipeline=device.createComputePipeline({layout:'auto',compute:{module:computeModule,entryPoint:'main'}});
      const renderPipeline=device.createRenderPipeline({
        layout:'auto',vertex:{module:renderModule,entryPoint:'vs'},fragment:{module:renderModule,entryPoint:'fs',targets:[{format}]},
        primitive:{topology:'triangle-list'}
      });
      const computeGroups=[
        device.createBindGroup({layout:computePipeline.getBindGroupLayout(0),entries:[
          {binding:0,resource:rippleTextures[0].createView()},{binding:1,resource:rippleTextures[1].createView()},
          {binding:2,resource:causticTexture.createView()},{binding:3,resource:{buffer:simBuffer}}
        ]}),
        device.createBindGroup({layout:computePipeline.getBindGroupLayout(0),entries:[
          {binding:0,resource:rippleTextures[1].createView()},{binding:1,resource:rippleTextures[0].createView()},
          {binding:2,resource:causticTexture.createView()},{binding:3,resource:{buffer:simBuffer}}
        ]})
      ];
      const renderGroups=[0,1].map(i=>device.createBindGroup({layout:renderPipeline.getBindGroupLayout(0),entries:[
        {binding:0,resource:{buffer:uniformBuffer}},{binding:1,resource:sampler},
        {binding:2,resource:rippleTextures[i].createView()},{binding:3,resource:causticTexture.createView()}
      ]}));

      let ping=0, prev=performance.now(), frameCount=0, fpsTime=prev, visibleFrames=0;
      const uniforms=new Float32Array(32), simData=new Float32Array(8);
      function resize(){
        const mobile=innerWidth<720;
        const scale=Math.min(device.limits.maxTextureDimension2D/Math.max(innerWidth,innerHeight),Math.min(devicePixelRatio,mobile?.85:1.2));
        const w=Math.max(2,Math.floor(innerWidth*scale)),h=Math.max(2,Math.floor(innerHeight*scale));
        if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}
      }
      addEventListener('resize',resize); resize();

      function frame(now){
        resize();
        const dt=Math.min((now-prev)/1000,.035); prev=now;
        const time=now/1000;
        const light=lightState(state.day);
        const cam=cameraPosition();
        const write4=(o,a,b,c,d)=>{uniforms[o]=a;uniforms[o+1]=b;uniforms[o+2]=c;uniforms[o+3]=d;};
        write4(0,canvas.width,canvas.height,time,state.day);
        write4(4,...cam,0);
        write4(8,...state.target,0);
        write4(12,...light.sun,0);
        write4(16,state.tide,state.wave,light.night,innerWidth<720?.78:1);
        write4(20,...light.top,0);
        write4(24,...light.bottom,0);
        write4(28,state.yaw,state.pitch,state.distance,0);
        device.queue.writeBuffer(uniformBuffer,0,uniforms);

        simData[0]=time;simData[1]=dt;simData[2]=state.wave;simData[3]=state.tide;
        if(state.drop){simData[4]=state.drop[0];simData[5]=1-state.drop[1];simData[6]=1;simData[7]=.8;state.drop=null;}
        else {simData[4]=0;simData[5]=0;simData[6]=0;simData[7]=0;}
        device.queue.writeBuffer(simBuffer,0,simData);

        const encoder=device.createCommandEncoder();
        const cp=encoder.beginComputePass();cp.setPipeline(computePipeline);cp.setBindGroup(0,computeGroups[ping]);cp.dispatchWorkgroups(simSize/8,simSize/8);cp.end();
        ping=1-ping;
        const rp=encoder.beginRenderPass({colorAttachments:[{view:context.getCurrentTexture().createView(),clearValue:{r:0,g:.04,b:.06,a:1},loadOp:'clear',storeOp:'store'}]});
        rp.setPipeline(renderPipeline);rp.setBindGroup(0,renderGroups[ping]);rp.draw(3);rp.end();
        device.queue.submit([encoder.finish()]);

        if(state.audio) state.audio.panner.pan.setTargetAtTime(Math.sin(state.yaw)*.32,state.audio.ctx.currentTime,.15);
        frameCount++; visibleFrames++;
        if(now-fpsTime>700){const fps=Math.round(frameCount*1000/(now-fpsTime));fpsEl.textContent=`${fps} FPS`;frameCount=0;fpsTime=now;}
        if(visibleFrames===3){loading.classList.add('hidden');statusEl.textContent='WEBGPU · LIVE WATER';}
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }

    start().catch(err=>{
      console.error(err);
      loading.classList.add('hidden');unsupported.classList.add('show');
      unsupported.querySelector('p:last-child').innerHTML=`初始化失败：<code>${String(err.message||err)}</code>`;
    });
  })();
  </script>
</body>
